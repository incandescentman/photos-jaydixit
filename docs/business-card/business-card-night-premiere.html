<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business card — Night Premiere — Jay Dixit</title>
<!--
  PRINT ARTIFACT — NOT a site asset.
  Standard US business card: 3.5 x 2 in, landscape, two faces.
  Each face is built at 1050 x 600 CSS px (3.5x2in @ 300dpi). All px values are
  scaled to this canvas so proportions are print-true.
  Exported via Playwright at deviceScaleFactor 2 -> 2100 x 1200 PNG (600dpi-class).

  SAFE ZONE: keep all text >= 1/8 in (37px at this scale) from every edge.
  All type sits inside 80px padding, well inside the safe zone. On the FRONT,
  the mark is fully contained: the complete outer gold ring is visible with
  margin on every side (visible ring edge ~69px from the right trim, ~118px
  from top/bottom). Nothing touches or crosses the trim line.

  NO BLEED: these faces are trimmed exactly at 3.5x2in with no bleed margin.
  A print shop may ask for a bleed version (typically +0.125in / 37px per edge,
  background extended). Because the ground is solid tuxedo black and nothing
  sits near the trim edge, a bleed build is trivial — just extend the black.

  Design language reused verbatim from the exported OG card:
  docs/og-card-explorations/og-card-night-premiere.html
-->
<style>
  /* Same Google Fonts load as the OG card and src/styles/global.css */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --cream:#FAF6EF;
    --ink:#141312;   /* tuxedo black ground */
    --gold:#C6A15B;
    --red:#B3272D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#3a3a3a;}
  body{display:flex;flex-direction:column;align-items:center;gap:48px;padding:48px;}

  /* TRUE print-proportion face: 1050 x 600 = 3.5 x 2 in @ 300dpi */
  .card{
    width:1050px;height:600px;position:relative;overflow:hidden;
    background:var(--ink);
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- FRONT ----------
     Text column left, vertically centered. Mark LARGE on the right —
     437px SVG box, vertically centered, FULLY CONTAINED: the box sits 32px
     inside the right edge, and because the gold ring is inset within the SVG
     viewBox, the ring's visible edge lands ~69px from the right trim and
     ~118px from top/bottom. The complete circle is visible; nothing clips. */
  #front .inner{
    position:absolute;inset:0;
    padding:0 80px;                 /* text safe zone: >= 37px from edges */
    display:flex;flex-direction:column;justify-content:center;
  }
  #front .mark{
    position:absolute;line-height:0;
    top:50%;right:32px;transform:translateY(-50%);
  }
  #front .lockup{position:relative;}
  #front .name{
    font-size:112px;font-weight:500;line-height:0.98;color:var(--cream);
  }
  #front .desc{
    font-size:35px;font-weight:400;line-height:1.16;color:var(--cream);
    margin-top:12px;
  }
  #front .desc em{font-style:italic;}
  #front .rule{width:120px;height:2px;background:var(--gold);margin:22px 0 16px;}
  #front .badge{
    font-family:'Karla',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.26em;font-size:18px;color:var(--gold);
  }
  #front .contact{
    margin-top:34px;
    font-family:'Karla',sans-serif;font-weight:400;
    font-size:19px;letter-spacing:.02em;line-height:1.5;
    color:rgba(250,246,239,0.78);   /* soft cream */
  }

  /* ---------- BACK ---------- */
  #back .inner{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>

  <!-- FRONT FACE -->
  <div class="card" id="front">
    <div class="inner">
      <div class="mark">
        <!-- Ghost-disc mark rebuilt for dark ground: cream ghost disc + red-carpet runner + gold ring.
             Large (437px SVG box), vertically centered, fully inside the card — complete ring visible. -->
        <svg width="437" height="437" viewBox="0 0 32 32" aria-label="Jay Dixit Photos">
          <defs><clipPath id="fm"><circle cx="16" cy="16" r="11.8"/></clipPath></defs>
          <circle cx="16" cy="16" r="12.6" fill="#FAF6EF" fill-opacity="0.06"/>
          <g clip-path="url(#fm)"><polygon points="12.8,6.5 19.2,6.5 28,30.5 4,30.5" fill="#B3272D"/></g>
          <circle cx="16" cy="16" r="12.6" fill="none" stroke="#C6A15B" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="lockup">
        <div class="name">Jay Dixit</div>
        <div class="desc">Red Carpet <em>&amp;</em> Portrait Photographer</div>
        <div class="rule"></div>
        <div class="badge">Wikiportraits &middot; Wikipedia</div>
        <div class="contact">
          jay@jaydixit.com<br>
          photos.jaydixit.com
        </div>
      </div>
    </div>
  </div>

  <!-- BACK FACE -->
  <div class="card" id="back">
    <div class="inner">
      <!-- Mark large and centered, nothing else -->
      <svg width="320" height="320" viewBox="0 0 32 32" aria-label="Jay Dixit Photos">
        <defs><clipPath id="bm"><circle cx="16" cy="16" r="11.8"/></clipPath></defs>
        <circle cx="16" cy="16" r="12.6" fill="#FAF6EF" fill-opacity="0.06"/>
        <g clip-path="url(#bm)"><polygon points="12.8,6.5 19.2,6.5 28,30.5 4,30.5" fill="#B3272D"/></g>
        <circle cx="16" cy="16" r="12.6" fill="none" stroke="#C6A15B" stroke-width="1.4"/>
      </svg>
    </div>
  </div>

</body>
</html>
