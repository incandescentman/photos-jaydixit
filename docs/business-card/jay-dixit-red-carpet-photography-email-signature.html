<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Jay Dixit — Red Carpet Photography Email Signature</title>
	</head>
	<body style="margin: 24px; background: #ffffff">
		<!--
			Email-client-safe signature.
			Open this file in a browser, select the signature, copy it, and paste it
			into the email client's rich-text signature editor.

			The red-carpet seal replaces the old Cannes photograph. It uses the
			existing production-hosted PNG so it remains visible after the email
			leaves this computer. Text links replace emoji for consistent rendering
			across email clients. All signature styling is inline.
		-->
		<table
			role="presentation"
			cellpadding="0"
			cellspacing="0"
			border="0"
			style="
				border-collapse: collapse;
				color: #16120f;
				font-family: Arial, Helvetica, sans-serif;
				-webkit-font-smoothing: antialiased;
			"
		>
			<tr>
				<td style="padding: 1px 15px 0 0; vertical-align: top">
					<a
						href="https://photos.jaydixit.com/"
						style="border: 0; color: #16120f; text-decoration: none"
					>
						<img
							src="https://photos.jaydixit.com/apple-touch-icon.png"
							width="84"
							height="84"
							alt="Jay Dixit Photos"
							style="display: block; width: 84px; height: 84px; border: 0"
						/>
					</a>
				</td>
				<td style="padding: 0 0 0 15px; border-left: 1px solid #c6a15b; vertical-align: top">
					<div
						style="
							margin: 0;
							color: #16120f;
							font-family: Georgia, 'Times New Roman', serif;
							font-size: 21px;
							font-weight: 400;
							letter-spacing: -0.2px;
							line-height: 24px;
						"
					>
						Jay Dixit
					</div>
					<div
						style="
							margin: 2px 0 0;
							color: #3f3934;
							font-family: Georgia, 'Times New Roman', serif;
							font-size: 13px;
							line-height: 17px;
						"
					>
						Red Carpet &amp; Portrait Photographer
					</div>
					<div
						style="
							margin: 5px 0 0;
							color: #9a7737;
							font-size: 9px;
							font-weight: 700;
							letter-spacing: 2px;
							line-height: 13px;
							text-transform: uppercase;
						"
					>
						<a href="https://www.wikiportraits.org/" style="color: #9a7737; text-decoration: none"
							>WikiPortraits</a
						>
						&nbsp;·&nbsp;
						<a
							href="https://commons.wikimedia.org/wiki/User:Jaydixit"
							style="color: #9a7737; text-decoration: none"
							>Wikipedia</a
						>
					</div>
					<div style="margin: 6px 0 0; color: #7c2430; font-size: 12px; line-height: 17px">
						<a href="https://photos.jaydixit.com/" style="color: #7c2430; text-decoration: none"
							>photos.jaydixit.com</a
						>
						<span style="color: #c6a15b">&nbsp;·&nbsp;</span>
						<a
							href="https://commons.gallery/@jaydixit/"
							style="color: #7c2430; text-decoration: none"
							>Wikipedia portfolio</a
						>
					</div>
				</td>
			</tr>
		</table>
	</body>
</html>
