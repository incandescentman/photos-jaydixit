<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG card — Night Premiere — photos.jaydixit.com</title>
<style>
  /* Same Google Fonts load as src/styles/global.css and the contact sheet */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --cream:#FAF6EF;
    --ink:#141312;
    --gold:#C6A15B;
    --red:#B3272D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;}

  /* TRUE 1200x630 canvas — no scale transform, no margin.
     This is the source of record for the exported public/og-card.png. */
  #og-card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:var(--ink);
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #og-card .inner{
    position:absolute;inset:0;
    display:flex;align-items:center;
    padding:0 120px;gap:90px;
  }
  #og-card .mark{flex:none;}
  #og-card .name{font-size:126px;font-weight:500;line-height:1.0;color:var(--cream);}
  #og-card .desc{font-size:42px;font-weight:400;line-height:1.18;color:var(--cream);margin-top:16px;}
  #og-card .desc em{font-style:italic;}
  #og-card .rule{width:130px;height:2px;background:var(--gold);margin:26px 0 20px;}
  #og-card .badge{
    font-family:'Karla',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.26em;font-size:22px;color:var(--gold);
  }
</style>
</head>
<body>
  <!-- Night Premiere: tuxedo black, mark rebuilt for dark ground, cream + gold type. -->
  <div id="og-card">
    <div class="inner">
      <div class="mark">
        <!-- inline ghost-disc mark for dark grounds (ring + fused runner, near-invisible disc) -->
        <svg width="370" height="370" viewBox="0 0 32 32">
          <defs><clipPath id="nm370"><circle cx="16" cy="16" r="11.8"/></clipPath></defs>
          <circle cx="16" cy="16" r="12.6" fill="#FAF6EF" fill-opacity="0.06"/>
          <g clip-path="url(#nm370)"><polygon points="12.8,6.5 19.2,6.5 28,30.5 4,30.5" fill="#B3272D"/></g>
          <circle cx="16" cy="16" r="12.6" fill="none" stroke="#C6A15B" stroke-width="1.4"/>
        </svg>
      </div>
      <div>
        <div class="name">Jay Dixit</div>
        <div class="desc">Red Carpet <em>&amp;</em> Portrait Photographer</div>
        <div class="rule"></div>
        <div class="badge">Wikiportraits &middot; Wikipedia</div>
      </div>
    </div>
  </div>
</body>
</html>
